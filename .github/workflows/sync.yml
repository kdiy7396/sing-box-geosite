name: Daily Sync and Compile Rules

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Install Latest sing-box CLI
        run: |
          TAG=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r .tag_name)
          VERSION=${TAG#v}
          echo "Installing sing-box version $VERSION"
          curl -LO "https://github.com/SagerNet/sing-box/releases/download/${TAG}/sing-box-${VERSION}-linux-amd64.tar.gz"
          tar -xzf "sing-box-${VERSION}-linux-amd64.tar.gz"
          sudo mv "sing-box-${VERSION}-linux-amd64/sing-box" /usr/local/bin/
          rm -rf "sing-box-${VERSION}-linux-amd64.tar.gz" "sing-box-${VERSION}-linux-amd64"
          sing-box version

      - name: Run Main Script & Force Compile Rules
        run: |
          python main.py

      - name: Commit and Push Updated Rules
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 强制把 rule 目录下的所有更改/新增文件添加进 git
          git add rule/*.srs
          
          # 判断是否有更新
          if git status --porcelain | grep -q .; then
            git commit -m "auto: restore/update rule sets $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push origin main
            echo "Rules updated and pushed successfully."
          else
            echo "No changes detected in rule binary output."
          fi
