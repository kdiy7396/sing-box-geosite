name: Monthly Clean Expired Rules

on:
  schedule:
    - cron: '0 22 28-31 * *' 
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 关键：拉取完整的 Git 提交历史，以准确计算文件的最后修改时间

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Clean Script
        run: |
          python clean_old_rules.py

      - name: Commit and Push Clean Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A rule/
          if git diff --staged --quiet; then
            echo "No expired files found to clean."
          else
            git commit -m "Auto clean expired rule-sets (> 30 days) [$(date +'%Y-%m-%d')]"
            git push
          fi
